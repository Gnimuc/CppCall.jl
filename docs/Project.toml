[deps]
# ClangCompiler is a dependency of CppCall, not of the docs -- but it reads its own
# `libclangex` preference by *name* during `__init__`, and Preferences resolves a name through
# the active project. From the docs environment, where it is only an indirect dependency, that
# lookup fails and loading CppCall dies with "Cannot resolve package 'ClangCompiler' in load
# path". Naming it here makes it resolvable. Remove once ClangCompiler looks its preference up
# by module instead: https://github.com/Gnimuc/ClangCompiler.jl/issues/58
ClangCompiler = "06fc9500-c033-43bc-8ca2-e20da63309d9"
CppCall = "f8cf9361-dadf-4655-ba37-7d4cfa6bff53"
Documenter = "e30172f5-a6a5-5a46-863b-614d45cd2de4"
